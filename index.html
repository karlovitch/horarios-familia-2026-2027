function listText(arr,emptyText){return arr&&arr.length?arr.map(esc).join(" · "):emptyText}
function renderDailyInfo(){
 const box=qs("#dailyInfoBody"),dateEl=qs("#dailyInfoDate"),today=isoLocalDate();
 dateEl.textContent=new Intl.DateTimeFormat("pt-PT",{day:"2-digit",month:"long",year:"numeric"}).format(new Date());
 const x=DAILY_INFO&&DAILY_INFO.date===today?DAILY_INFO:null;
 const un=x?listText(x.un_days,"Sem efeméride ONU assinalada hoje"):"Consultar calendário ONU";
 const eu=x?listText(x.european_days,"Sem dia europeu assinalado hoje"):"Sem dados atualizados";
 const pt=x?listText(x.portugal_days,"Sem efeméride nacional portuguesa selecionada hoje"):"Sem dados atualizados";
 const local=x?listText(x.local_days,"Sem efeméride local assinalada hoje"):"Sem dados atualizados";
 const lit=x&&x.liturgical_day?esc(x.liturgical_day):"Liturgia do dia";
 const saints=x?listText(x.saints,"Sem memória/solenidade adicional indicada"):"Consultar fonte";
 const gospel=x&&x.gospel?esc(x.gospel):"Ver referência";
 const litUrl=x&&x.liturgy_url?x.liturgy_url:liturgiaUrlForToday();
 box.innerHTML=
  '<div class="daily-row"><div class="daily-label">ONU</div><div class="daily-value">'+un+'</div></div>'+
  '<div class="daily-row"><div class="daily-label">Europa</div><div class="daily-value">'+eu+'</div></div>'+
  '<div class="daily-row"><div class="daily-label">Portugal</div><div class="daily-value">'+pt+'</div></div>'+
  (x&&x.local_days&&x.local_days.length?'<div class="daily-row"><div class="daily-label">Barcelos</div><div class="daily-value">'+local+'</div></div>':'')+
  '<div class="daily-row"><div class="daily-label">Liturgia</div><div class="daily-value">'+lit+'</div></div>'+
  '<div class="daily-row"><div class="daily-label">Santo(s)</div><div class="daily-value">'+saints+'</div></div>'+
  '<div class="daily-row"><div class="daily-label">Evangelho</div><div class="daily-value">'+gospel+' · <a href="'+litUrl+'" target="_blank" rel="noopener">ver Liturgia diária</a></div></div>';
}
async function loadDailyInfo(){
 try{
  const r=await fetch("daily-info.json?d="+isoLocalDate(),{cache:"no-store"});
  if(r.ok){DAILY_INFO=await r.json();try{localStorage.setItem("dailyInfo",JSON.stringify(DAILY_INFO))}catch(e){}}
 }catch(e){
  try{const s=localStorage.getItem("dailyInfo");if(s)DAILY_INFO=JSON.parse(s)}catch(_){}
 }
 renderDailyInfo();
}
function eventHTML(e,d){return '<article class="event '+(current(e,d)?"current ":"")+(e.special==="english"?"english":"")+'"><div class="event-time">'+e.start+'<br>'+e.end+'</div><div class="event-main"><strong>'+esc(e.title)+'</strong>'+(e.place?'<span>'+esc(e.place)+'</span>':'')+'</div></article>'}
function dayButtons(c,a,f){c.innerHTML=SCHOOL_DAYS.map(d=>'<button type="button" class="day-tab '+(d===a?"active":"")+'" data-day="'+d+'">'+d+'</button>').join("");c.querySelectorAll(".day-tab").forEach(b=>b.addEventListener("click",()=>f(b.dataset.day)))}
function renderOverview(){renderCountdowns();const d=selectedDay||(SCHOOL_DAYS.includes(dayNow())?dayNow():"Segunda");selectedDay=d;dayButtons(qs("#overviewDays"),d,x=>{selectedDay=x;renderOverview()});const active=PEOPLE.filter(p=>activeEvent(p,d));const summary=qs("#activeSummary");if(d===dayNow()&&active.length){summary.textContent="Agora: "+active.join(", ");summary.classList.remove("hidden")}else{summary.classList.add("hidden");summary.textContent=""}let h='<div class="time-axis">';for(let m=480;m<=1080;m+=60)h+='<div class="time-label" style="top:'+timelineY(m)+'px">'+String(Math.floor(m/60)).padStart(2,"0")+':00</div>';h+='</div>';for(const p of PEOPLE){const i=D[p],isActive=!!activeEvent(p,d);h+='<div class="lane '+(isActive?"active-person":"")+'"><div class="lane-head" style="background:'+i.color+'">'+p+(isActive?'<span class="live-badge">Agora</span>':'')+'</div>';if(p==="Margarida"&&d==="Sexta"){for(const s of MARGARIDA_FRIDAY_SESSIONS)h+='<div class="session-outline" style="top:'+timelineY(toMin(s.start))+'px;height:'+Math.max(timelineDur(s.start,s.end),18)+'px"></div>';}for(const e of i.days[d]||[])h+='<div class="block '+(e.special==="english"?"english ":"")+(current(e,d)?"current-block":"")+'" style="top:'+timelineY(toMin(e.start))+'px;height:'+Math.max(timelineDur(e.start,e.end),18)+'px;background:'+i.color+'"><strong>'+e.start+'–'+e.end+'</strong><span>'+esc(e.title)+'</span>'+(e.place?'<em>'+esc(e.place)+'</em>':'')+'</div>';h+='</div>'}if(d===dayNow()){const n=nowMin();if(n>=START&&n<=END)h+='<div class="now-line" style="top:'+timelineY(n)+'px"></div>'}qs("#timeline").innerHTML=h}
function personCard(p,d){const i=D[p],ev=i.days[d]||[],isActive=!!activeEvent(p,d);return '<section class="card '+(isActive?"active-person-card":"")+'"><div class="card-head" style="background:'+i.color+'"><span>'+p+(isActive?' <span class="live-badge">Agora</span>':'')+'</span><small>'+d+'</small></div><div class="events">'+(ev.length?ev.map(e=>eventHTML(e,d)).join(""):'<div class="empty">Sem horário.</div>')+'</div></section>'}
function renderToday(){renderCountdowns();renderDailyInfo();const d=dayNow();qs("#todayDay").textContent=d;qs("#todayCards").innerHTML=SCHOOL_DAYS.includes(d)?PEOPLE.map(p=>personCard(p,d)).join(""):'<section class="card"><div class="empty">Hoje não há horário definido.</div></section>'}
function renderPerson(){renderCountdowns();const p=person,i=D[p],d=selectedDay||(SCHOOL_DAYS.includes(dayNow())?dayNow():"Segunda");selectedDay=d;qs("#personName").textContent=p;qs(".person-title").style.borderLeft='8px solid '+i.color;qs(".person-title").style.paddingLeft="10px";qs("#personDayMode").classList.toggle("active",personMode==="day");qs("#personWeekMode").classList.toggle("active",personMode==="week");const days=qs("#personDays"),cards=qs("#personCards");if(personMode==="week"){days.classList.add("hidden");cards.classList.remove("one");cards.classList.add("weekly");cards.innerHTML=SCHOOL_DAYS.map(day=>personCard(p,day)).join("")}else{days.classList.remove("hidden");cards.classList.add("one");cards.classList.remove("weekly");dayButtons(days,d,x=>{selectedDay=x;renderPerson()});cards.innerHTML=personCard(p,d)}}
function show(v){view=v;qs("#overview").classList.toggle("hidden",v!=="overview");qs("#today").classList.toggle("hidden",v!=="today");qs("#person").classList.toggle("hidden",!D[v]);qsa(".main-tab").forEach(b=>b.classList.toggle("active",b.dataset.view===v));if(v==="overview"){person=null;selectedDay=null;renderOverview()}else if(v==="today"){person=null;selectedDay=null;renderToday()}else if(D[v]){person=v;selectedDay=null;personMode="day";renderPerson()}}
qs("#todayLabel").textContent=new Intl.DateTimeFormat("pt-PT",{weekday:"long",day:"2-digit",month:"long"}).format(new Date());qsa(".main-tab").forEach(b=>b.addEventListener("click",()=>show(b.dataset.view)));qs("#personDayMode").addEventListener("click",()=>{personMode="day";renderPerson()});qs("#personWeekMode").addEventListener("click",()=>{personMode="week";renderPerson()});qs("#goTodayBtn").addEventListener("click",()=>{const d=dayNow();if(SCHOOL_DAYS.includes(d)){selectedDay=d;renderOverview()}else{show("today")}});loadDailyInfo();show("overview");window.addEventListener("resize",()=>{if(view==="overview")renderOverview()});setInterval(()=>{if(view==="overview")renderOverview();if(view==="today")renderToday();if(person)renderPerson()},60000);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;qs("#installBtn").classList.remove("hidden")});qs("#installBtn").addEventListener("click",async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;qs("#installBtn").classList.add("hidden")});window.addEventListener("appinstalled",()=>qs("#installBtn").classList.add("hidden"));if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body></html>
