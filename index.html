<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#162033">
<meta name="description" content="Horários da família 2026-2027">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Horários Família</title>
<style>
:root{--bg:#f5f7fb;--text:#172033;--muted:#6b7280;--border:#d7dde7;--dark:#162033;--english:#fff2cc;--blue:#2563eb;--red:#dc2626}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit}.top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:rgba(22,32,51,.98);color:#fff}
.top h1{margin:0;font-size:1.4rem}.top p{margin:2px 0 0;color:#cbd5e1;font-size:.88rem}.install{border:0;border-radius:10px;padding:9px 13px;font-weight:800;background:#fff;color:#162033}.hidden{display:none!important}
main{max-width:1180px;margin:0 auto;padding:12px 12px 36px}.main-tabs,.day-tabs{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:2px 0 12px}.main-tabs::-webkit-scrollbar,.day-tabs::-webkit-scrollbar{display:none}
.main-tab,.day-tab{flex:0 0 auto;border:1px solid var(--border);background:#fff;border-radius:999px;padding:9px 14px;font-weight:750;color:var(--text)}.main-tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}.day-tab.active{background:#dbe5f0;border-color:#9aaec2}
.screen-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:4px 0 8px}.screen-head h2{margin:0;font-size:1.15rem}.screen-head p{margin:2px 0 0;font-size:.84rem;color:var(--muted)}.today-jump{flex:0 0 auto;border:1px solid #9aaec2;background:#fff;color:var(--dark);border-radius:10px;padding:9px 12px;font-weight:800}.today-jump:active{transform:translateY(1px)}.active-summary{margin:0 0 10px;padding:9px 11px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:11px;font-size:.84rem;font-weight:700;color:#1e3a8a}
.timeline-scroll{overflow-x:auto;padding-bottom:6px}.timeline{position:relative;display:grid;grid-template-columns:50px repeat(4,minmax(145px,1fr));min-width:700px;height:650px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff}
.time-axis{position:relative;border-right:1px solid var(--border);background:#fafbfd}.time-label{position:absolute;left:4px;font-size:.7rem;color:var(--muted);transform:translateY(-50%)}
.lane{position:relative;border-right:1px solid #e5e7eb;background:repeating-linear-gradient(to bottom,transparent 0,transparent 30px,#f0f2f5 31px)}.lane:last-child{border-right:0}
.lane-head{position:sticky;top:0;z-index:12;height:34px;text-align:center;padding:7px 4px;font-weight:800;font-size:.86rem;border-bottom:1px solid rgba(0,0,0,.12)}.lane.active-person{box-shadow:inset 0 0 0 3px var(--blue);z-index:1}.lane.active-person .lane-head{box-shadow:inset 0 -3px 0 var(--blue)}.live-badge{display:inline-block;margin-left:4px;padding:2px 5px;border-radius:999px;background:#1d4ed8;color:#fff;font-size:.58rem;line-height:1.2;vertical-align:1px}
.session-outline{position:absolute;left:2px;right:2px;border:1px dashed rgba(71,85,105,.55);border-radius:8px;background:rgba(255,255,255,.20);pointer-events:none;z-index:1}.block{position:absolute;left:5px;right:5px;padding:4px 5px;border:1px solid rgba(22,32,51,.28);border-radius:8px;overflow:hidden;font-size:.72rem;line-height:1.12;box-shadow:0 1px 4px rgba(22,32,51,.07);z-index:2}
.block strong{display:block;font-size:.74rem}.block span{display:block;margin-top:2px}.block em{display:block;font-style:normal;opacity:.72;margin-top:2px}.block.english{background:var(--english)!important}.block.current-block{outline:3px solid var(--blue);outline-offset:-2px;z-index:6}
.now-line{position:absolute;left:50px;right:0;height:2px;background:var(--red);z-index:10;pointer-events:none}.now-line:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cards.one{grid-template-columns:1fr}.card{background:#fff;border:1px solid var(--border);border-radius:15px;overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-weight:800}.card-head small{opacity:.65}.card.active-person-card{border:2px solid var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.10)}.card.active-person-card .card-head{box-shadow:inset 0 -3px 0 var(--blue)}.events{padding:8px 10px 10px;display:grid;gap:7px}
.event{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:center;padding:9px;border:1px solid #e5e9f1;border-radius:11px;background:#fafbfd}.event.current{outline:2px solid var(--blue);background:#eff6ff}.event.english{background:var(--english)}
.event-time{font-size:.82rem;font-weight:800;line-height:1.16}.event-main{min-width:0}.event-main strong{display:block;font-size:.92rem}.event-main span{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}.empty{padding:18px 12px;text-align:center;color:var(--muted)}
@media(max-width:700px){main{padding:8px 6px 28px}.main-tabs,.day-tabs{gap:5px;padding-bottom:8px}.main-tab,.day-tab{padding:8px 10px;font-size:.82rem}.screen-head{align-items:center}.screen-head h2{font-size:1.05rem}.screen-head p{font-size:.76rem}.today-jump{padding:8px 9px;font-size:.78rem}.active-summary{margin-bottom:8px;padding:8px 9px;font-size:.76rem}.timeline-scroll{margin:0 -6px;padding:0 6px 6px}.timeline{grid-template-columns:38px repeat(4,minmax(92px,1fr));min-width:430px;height:600px;border-radius:10px}.time-label{left:2px;font-size:.6rem}.lane-head{height:31px;padding:6px 2px;font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.live-badge{display:block;width:max-content;margin:2px auto 0;font-size:.52rem;padding:1px 4px}.session-outline{left:1px;right:1px;border-radius:6px}.block{left:2px;right:2px;padding:2px 3px;border-radius:6px;font-size:.59rem;line-height:1.05}.block strong{font-size:.61rem}.block span{margin-top:1px}.block em{font-size:.56rem;margin-top:1px}.now-line{left:38px}.cards{grid-template-columns:1fr}.event{grid-template-columns:82px 1fr}}
</style>
</head>
<body>
<header class="top"><div><h1>Horários</h1><p id="todayLabel">2026–2027</p></div><button id="installBtn" class="install hidden" type="button">Instalar</button></header>
<main>
<nav class="main-tabs" aria-label="Modo de consulta">
<button class="main-tab active" data-view="overview" type="button">Conjunto</button><button class="main-tab" data-view="today" type="button">Hoje</button>
<button class="main-tab" data-view="Carlos" type="button">Carlos</button><button class="main-tab" data-view="Sandra" type="button">Sandra</button>
<button class="main-tab" data-view="Margarida" type="button">Margarida</button><button class="main-tab" data-view="Leonor" type="button">Leonor</button>
</nav>
<section id="overview" class="screen"><div class="screen-head"><div><h2>Vista de conjunto</h2><p>Os blocos estão colocados proporcionalmente à hora real.</p></div><button id="goTodayBtn" class="today-jump" type="button">Ir para hoje</button></div><div id="activeSummary" class="active-summary hidden" aria-live="polite"></div><div id="overviewDays" class="day-tabs"></div><div class="timeline-scroll"><div id="timeline" class="timeline"></div></div></section>
<section id="today" class="screen hidden"><div class="screen-head"><div><h2>Hoje</h2><p id="todayDay"></p></div></div><div id="todayCards" class="cards"></div></section>
<section id="person" class="screen hidden"><div class="screen-head person-title"><div><h2 id="personName"></h2><p>Horário individual</p></div></div><div id="personDays" class="day-tabs"></div><div id="personCards" class="cards one"></div></section>
</main>
<script>
const D={
Carlos:{color:"#F4DF68",days:{
Segunda:[["08:25","09:55","10.º I · História A","E 8"],["10:10","11:40","10.º G · História A","E 7"],["11:50","13:20","10.º H · História A","E 14"]],
Terça:[["08:25","09:55","10.º G · História A","E 7"],["10:10","11:40","8.º B · História","E 11"],["11:50","13:20","10.º I · História A","E 8"],["14:25","15:55","9.º B · História","D 11"]],
Quarta:[["08:25","09:55","9.º A · História","D 8"],["10:10","11:40","10.º G · História A","E 7"],["11:50","13:20","10.º H · História A","E 9"]],Quinta:[],
Sexta:[["08:25","09:55","10.º H · História A","E 9"],["10:55","11:40","CNL Escola","Gab. Grupo 400"],["11:50","13:20","10.º I · História A","E 8"]]}},
Sandra:{color:"#F7E7A6",days:{
Segunda:[["09:00","10:30","Apoio educativo letivo",""],["11:00","13:00","Apoio educativo letivo",""],["14:30","15:30","Coordenação de escola",""],["15:30","16:00","Funções de âmbito organizacional",""],["16:00","17:00","Coordenação de escola",""]],
Terça:[["09:00","10:30","Apoio educativo letivo",""],["11:00","13:00","Apoio educativo letivo",""],["14:30","15:30","Coordenação de escola",""],["15:30","16:00","Funções de âmbito organizacional",""],["16:00","17:00","Coordenação de escola",""]],
Quarta:[["09:00","10:30","Apoio educativo letivo",""],["11:00","12:00","Apoio educativo letivo",""],["12:00","13:00","Coordenação de escola",""],["14:30","15:30","Coordenação de escola",""],["15:30","16:00","Funções de âmbito organizacional",""]],
Quinta:[["09:00","10:30","Apoio educativo letivo",""],["11:00","12:00","Apoio educativo letivo",""],["12:00","13:00","Coordenação de escola",""]],
Sexta:[["09:00","10:30","Apoio educativo letivo",""],["11:00","12:00","Apoio educativo letivo",""],["12:00","13:00","Coordenação de escola",""]]}},
Margarida:{color:"#EFB5BD",days:{
Segunda:[["08:20","09:50","PORT","S 8"],["10:05","11:35","MATA","S 8"],["11:45","13:15","ING_I","S 8"]],
Terça:[["08:20","09:50","BGEO","LabBio"],["10:05","11:35","MATA","S 8"],["11:45","12:30","PORT","S 8"],["13:30","15:00","FIL","S 8"],["15:05","16:35","FQA","S 8"]],
Quarta:[["08:20","09:50","ING_I","S 8"],["10:05","11:35","BGEO","S 8"],["11:45","13:15","FIL","S 8"]],
Quinta:[["08:20","09:50","PORT","S 8"],["10:05","11:35","FQA","S 8"],["11:45","13:15","MATA","S 8"]],
Sexta:[["10:05","11:35","EDF","Pav. Adães"],["11:45","12:30","EDF","Pav. Adães"],["13:30","15:00","BGEO","LabBio"],["15:05","15:50","BGEO","LabBio"],["16:45","17:30","FQA","LabFQ"],["17:30","18:15","FQA","LabFQ"]]}},
Leonor:{color:"#BCD8EF",days:{
Segunda:[["09:00","10:30","Aulas",""],["11:00","12:00","Aulas",""],["14:00","15:00","Aulas",""],["15:00","16:00","Inglês","","english"]],
Terça:[["09:00","10:30","Aulas",""],["11:00","12:00","Aulas",""],["14:00","16:00","Aulas",""],["16:30","17:30","Aulas",""]],
Quarta:[["09:00","10:30","Aulas",""],["11:00","12:00","Aulas",""],["14:00","15:00","Inglês","","english"]],
Quinta:[["09:00","10:30","Aulas",""],["11:00","12:00","Aulas",""],["14:00","16:00","Aulas",""],["16:30","17:30","Aulas",""]],
Sexta:[["09:00","10:30","Aulas",""],["11:00","12:00","Aulas",""],["14:00","15:00","Aulas",""]]}}
};
for(const p of Object.keys(D))for(const d of Object.keys(D[p].days))D[p].days[d]=D[p].days[d].map(x=>({start:x[0],end:x[1],title:x[2],place:x[3],special:x[4]||""}));
const MARGARIDA_FRIDAY_SESSIONS=[
  {start:"10:05",end:"12:30",title:"EDF"},
  {start:"13:30",end:"15:50",title:"BGEO"},
  {start:"16:45",end:"18:15",title:"FQA"}
];
const SCHOOL_DAYS=["Segunda","Terça","Quarta","Quinta","Sexta"], WEEK=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"], PEOPLE=["Leonor","Margarida","Sandra","Carlos"], START=480,END=1110;
let view="overview",selectedDay=null,person=null,installPrompt=null;
const qs=s=>document.querySelector(s),qsa=s=>[...document.querySelectorAll(s)],toMin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m},isMobileTimeline=()=>window.matchMedia("(max-width:700px)").matches,timelineHeight=()=>isMobileTimeline()?600:650,laneHeaderHeight=()=>isMobileTimeline()?31:34,timelineY=m=>laneHeaderHeight()+((m-START)/(END-START))*(timelineHeight()-laneHeaderHeight()),timelineDur=(a,b)=>((toMin(b)-toMin(a))/(END-START))*(timelineHeight()-laneHeaderHeight()),dayNow=()=>WEEK[new Date().getDay()],nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()},esc=s=>(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),current=(e,d)=>d===dayNow()&&nowMin()>=toMin(e.start)&&nowMin()<toMin(e.end),activeEvent=(p,d)=>(D[p].days[d]||[]).find(e=>current(e,d));
function eventHTML(e,d){return '<article class="event '+(current(e,d)?"current ":"")+(e.special==="english"?"english":"")+'"><div class="event-time">'+e.start+'<br>'+e.end+'</div><div class="event-main"><strong>'+esc(e.title)+'</strong>'+(e.place?'<span>'+esc(e.place)+'</span>':'')+'</div></article>'}
function dayButtons(c,a,f){c.innerHTML=SCHOOL_DAYS.map(d=>'<button type="button" class="day-tab '+(d===a?"active":"")+'" data-day="'+d+'">'+d+'</button>').join("");c.querySelectorAll(".day-tab").forEach(b=>b.addEventListener("click",()=>f(b.dataset.day)))}
function renderOverview(){const d=selectedDay||(SCHOOL_DAYS.includes(dayNow())?dayNow():"Segunda");selectedDay=d;dayButtons(qs("#overviewDays"),d,x=>{selectedDay=x;renderOverview()});const active=PEOPLE.filter(p=>activeEvent(p,d));const summary=qs("#activeSummary");if(d===dayNow()&&active.length){summary.textContent="Agora: "+active.join(", ");summary.classList.remove("hidden")}else{summary.classList.add("hidden");summary.textContent=""}let h='<div class="time-axis">';for(let m=480;m<=1080;m+=60)h+='<div class="time-label" style="top:'+timelineY(m)+'px">'+String(Math.floor(m/60)).padStart(2,"0")+':00</div>';h+='</div>';for(const p of PEOPLE){const i=D[p],isActive=!!activeEvent(p,d);h+='<div class="lane '+(isActive?"active-person":"")+'"><div class="lane-head" style="background:'+i.color+'">'+p+(isActive?'<span class="live-badge">Agora</span>':'')+'</div>';if(p==="Margarida"&&d==="Sexta"){for(const s of MARGARIDA_FRIDAY_SESSIONS)h+='<div class="session-outline" style="top:'+timelineY(toMin(s.start))+'px;height:'+Math.max(timelineDur(s.start,s.end),18)+'px"></div>';}for(const e of i.days[d]||[])h+='<div class="block '+(e.special==="english"?"english ":"")+(current(e,d)?"current-block":"")+'" style="top:'+timelineY(toMin(e.start))+'px;height:'+Math.max(timelineDur(e.start,e.end),18)+'px;background:'+i.color+'"><strong>'+e.start+'–'+e.end+'</strong><span>'+esc(e.title)+'</span>'+(e.place?'<em>'+esc(e.place)+'</em>':'')+'</div>';h+='</div>'}if(d===dayNow()){const n=nowMin();if(n>=START&&n<=END)h+='<div class="now-line" style="top:'+timelineY(n)+'px"></div>'}qs("#timeline").innerHTML=h}
function personCard(p,d){const i=D[p],ev=i.days[d]||[],isActive=!!activeEvent(p,d);return '<section class="card '+(isActive?"active-person-card":"")+'"><div class="card-head" style="background:'+i.color+'"><span>'+p+(isActive?' <span class="live-badge">Agora</span>':'')+'</span><small>'+d+'</small></div><div class="events">'+(ev.length?ev.map(e=>eventHTML(e,d)).join(""):'<div class="empty">Sem horário.</div>')+'</div></section>'}
function renderToday(){const d=dayNow();qs("#todayDay").textContent=d;qs("#todayCards").innerHTML=SCHOOL_DAYS.includes(d)?PEOPLE.map(p=>personCard(p,d)).join(""):'<section class="card"><div class="empty">Hoje não há horário definido.</div></section>'}
function renderPerson(){const p=person,i=D[p],d=selectedDay||(SCHOOL_DAYS.includes(dayNow())?dayNow():"Segunda");selectedDay=d;qs("#personName").textContent=p;qs(".person-title").style.borderLeft='8px solid '+i.color;qs(".person-title").style.paddingLeft="10px";dayButtons(qs("#personDays"),d,x=>{selectedDay=x;renderPerson()});qs("#personCards").innerHTML=personCard(p,d)}
function show(v){view=v;qs("#overview").classList.toggle("hidden",v!=="overview");qs("#today").classList.toggle("hidden",v!=="today");qs("#person").classList.toggle("hidden",!D[v]);qsa(".main-tab").forEach(b=>b.classList.toggle("active",b.dataset.view===v));if(v==="overview"){person=null;selectedDay=null;renderOverview()}else if(v==="today"){person=null;selectedDay=null;renderToday()}else if(D[v]){person=v;selectedDay=null;renderPerson()}}
qs("#todayLabel").textContent=new Intl.DateTimeFormat("pt-PT",{weekday:"long",day:"2-digit",month:"long"}).format(new Date());qsa(".main-tab").forEach(b=>b.addEventListener("click",()=>show(b.dataset.view)));qs("#goTodayBtn").addEventListener("click",()=>{const d=dayNow();if(SCHOOL_DAYS.includes(d)){selectedDay=d;renderOverview()}else{show("today")}});show("overview");window.addEventListener("resize",()=>{if(view==="overview")renderOverview()});setInterval(()=>{if(view==="overview")renderOverview();if(view==="today")renderToday();if(person)renderPerson()},60000);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;qs("#installBtn").classList.remove("hidden")});qs("#installBtn").addEventListener("click",async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;qs("#installBtn").classList.add("hidden")});window.addEventListener("appinstalled",()=>qs("#installBtn").classList.add("hidden"));if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body></html>
