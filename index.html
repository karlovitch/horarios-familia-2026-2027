function currentSegmentInfo(p,today){

 if(today<=segs[0].endDay)return {segment:segs[0],index:0};

  if(today<=segs[i].endDay)return {segment:segs[i],index:i};

 }

}

 }

function lastWeekdayOfMonth(year,month0,weekday){
 const d=new Date(Date.UTC(year,month0+1,0));
 while(d.getUTCDay()!==weekday)d.setUTCDate(d.getUTCDate()-1);
 return d.toISOString().slice(0,10);
}
function portugalDaysFor(iso){
 const mmdd=iso.slice(5),y=Number(iso.slice(0,4)),out=[...(PORTUGAL_INSTITUTIONAL_FIXED[mmdd]||[])];
 if(PORTUGAL_HOLIDAY_FIXED[mmdd])out.unshift(formatHoliday(iso,PORTUGAL_HOLIDAY_FIXED[mmdd]));
 if(PORTUGAL_MOVABLE_HOLIDAYS[iso])out.unshift(PORTUGAL_MOVABLE_HOLIDAYS[iso]+" (Feriado Nacional; celebração religiosa, sem um ano histórico único consensual para o acontecimento celebrado)");
 if(iso===lastWeekdayOfMonth(y,4,0))out.push("Dia Nacional da Gastronomia Portuguesa — último domingo de maio");
 if(y>=2026&&iso===lastWeekdayOfMonth(y,9,4))out.push("Dia Nacional das Acessibilidades — última quinta-feira de outubro");
 return out;
}
function historyDaysFor(iso){
 const mmdd=iso.slice(5);
 return (HISTORY_META[mmdd]||[]).map(e=>e.label+" ("+e.year+"; há "+yearsSince(iso,e.year)+" anos)");
}
function isoLocalDate(){const n=new Date(),y=n.getFullYear(),m=String(n.getMonth()+1).padStart(2,"0"),d=String(n.getDate()).padStart(2,"0");return y+"-"+m+"-"+d}
function dateFromIso(iso){const [y,m,d]=iso.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))}
function liturgiaUrlForDate(iso){const [y,m,d]=iso.split("-").map(Number);return "https://liturgia.pt/liturgiadiaria/dia.php?data="+y+"-"+m+"-"+d}
function listText(arr,emptyText){return arr&&arr.length?arr.map(esc).join(" · "):emptyText}
function familyEventsFor(iso){
 const mmdd=iso.slice(5),year=Number(iso.slice(0,4));
 return FAMILY_EVENTS.filter(e=>e.date.slice(5)===mmdd).map(e=>{
  const baseYear=Number(e.date.slice(0,4)),years=year-baseYear;
  return e.kind==="birthday"?"Aniversário de "+e.label+" — "+years+" anos":e.label+" — "+years+" anos";
 });
}
function daysToNextAnnual(refIso,eventDate){
 const [ry,rm,rd]=refIso.split("-").map(Number),[,em,ed]=eventDate.split("-").map(Number);
 const ref=Math.floor(Date.UTC(ry,rm-1,rd)/MS_DAY);
 let target=Math.floor(Date.UTC(ry,em-1,ed)/MS_DAY);
 if(target<ref)target=Math.floor(Date.UTC(ry+1,em-1,ed)/MS_DAY);
 return target-ref;
}
function birthdayCountdownText(iso){

}

function translateSeason(s){
 const m={"Ordinary Time":"Tempo Comum","Advent":"Advento","Christmas":"Tempo do Natal","Christmas Time":"Tempo do Natal","Lent":"Quaresma","Eastertide":"Tempo Pascal","Easter":"Tempo Pascal","Holy Week":"Semana Santa"};
 return m[s]||s||"";
}
function translateCelebrationType(t){
 const m={FERIA:"Féria",FEAST:"Festa",MEMORIAL:"Memória",OPTIONAL_MEMORIAL:"Memória facultativa",SOLEMNITY:"Solenidade"};
 return m[t]||t||"";
}
function translateCelebrationName(name){
 if(!name)return "";
 const wd={Monday:"Segunda-feira",Tuesday:"Terça-feira",Wednesday:"Quarta-feira",Thursday:"Quinta-feira",Friday:"Sexta-feira",Saturday:"Sábado",Sunday:"Domingo"};
 const ordinary=name.match(/^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday) of the (\d+)(?:st|nd|rd|th) week of Ordinary Time$/);
 if(ordinary)return wd[ordinary[1]]+" da "+ordinary[2]+".ª semana do Tempo Comum";
 const seasonal=name.match(/^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday) of the (\d+)(?:st|nd|rd|th) week of (Advent|Lent|Eastertide|Christmas)$/);
 if(seasonal)return wd[seasonal[1]]+" da "+seasonal[2]+".ª semana do "+translateSeason(seasonal[3]);
 let t=name;
 const pairs=[["Saints Philip and James","Santos Filipe e Tiago"],["Saint Matthew","São Mateus"],["Saint Mark","São Marcos"],["Saint Luke","São Lucas"],["Saint John","São João"],["Saint Peter","São Pedro"],["Saint Paul","São Paulo"],["Saint Joseph","São José"],["Saint Andrew","Santo André"],["Saint Thomas","São Tomé"],["Saint Stephen","Santo Estêvão"],["Saint Francis","São Francisco"],["Saint Anthony","Santo António"],["Saint Augustine","Santo Agostinho"],["Saint Benedict","São Bento"],["Saint Gregory","São Gregório"],["Saint Jerome","São Jerónimo"],["Saint Lawrence","São Lourenço"],["Saint Martin","São Martinho"],["Saint Michael","São Miguel"],["Saint Raphael","São Rafael"],["Saint Dominic","São Domingos"],["Saint Teresa","Santa Teresa"],["Saint Thérèse","Santa Teresa"],["Blessed Virgin Mary","Virgem Santa Maria"],["The Blessed Virgin Mary","Virgem Santa Maria"],["Our Lady","Nossa Senhora"],["Nativity of the Lord","Natividade do Senhor"],["Epiphany of the Lord","Epifania do Senhor"],["Baptism of the Lord","Batismo do Senhor"],["Ascension of the Lord","Ascensão do Senhor"],["Pentecost Sunday","Domingo de Pentecostes"],["Most Holy Trinity","Santíssima Trindade"],["Corpus Christi","Santíssimo Corpo e Sangue de Cristo"],["Sacred Heart of Jesus","Sagrado Coração de Jesus"],["Christ the King","Cristo Rei"]];
 for(const [a,b] of pairs)t=t.replaceAll(a,b);
 t=t.replace(/\bSaints\b/g,"Santos").replace(/\bSaint\b/g,"São").replace(/\bApostles\b/g,"Apóstolos").replace(/\bApostle\b/g,"Apóstolo").replace(/\bEvangelists\b/g,"Evangelistas").replace(/\bEvangelist\b/g,"Evangelista").replace(/\bMartyrs\b/g,"Mártires").replace(/\bMartyr\b/g,"Mártir").replace(/\bBishops\b/g,"Bispos").replace(/\bBishop\b/g,"Bispo").replace(/\bPriests\b/g,"Presbíteros").replace(/\bPriest\b/g,"Presbítero").replace(/\bPope\b/g,"Papa").replace(/\bAbbot\b/g,"Abade").replace(/\bDoctor of the Church\b/g,"Doutor da Igreja");
 return t;
}
function translateGospelRef(ref){
 if(!ref)return "";
 const books={"Matthew":"Mt","Mark":"Mc","Luke":"Lc","John":"Jo"};
 for(const [en,pt] of Object.entries(books))if(ref.startsWith(en+" "))return pt+" "+ref.slice(en.length+1).replace(":",", ");
 return ref.replace(":",", ");
}
function remoteLiturgyFromStorage(iso){
 try{const raw=localStorage.getItem("liturgia:"+iso);if(raw){const x=JSON.parse(raw);REMOTE_LITURGY_CACHE[iso]=x;return x}}catch(e){}
 return null;
}
async function fetchCatholicJson(path){
 for(const base of [CATHOLIC_DATA_BASE,CATHOLIC_DATA_RAW]){
  try{const r=await fetch(base+path,{cache:"no-store"});if(r.ok)return await r.json()}catch(e){}
 }
 return null;
}
async function ensureRemoteLiturgy(iso){
 if(REMOTE_LITURGY_CACHE[iso]||REMOTE_LITURGY_LOADING.has(iso)||REMOTE_LITURGY_FAILED.has(iso))return;
 if(remoteLiturgyFromStorage(iso)){renderDailyInfo();return}
 const year=iso.slice(0,4),md=iso.slice(5);
 if(!["2026","2027"].includes(year))return;
 REMOTE_LITURGY_LOADING.add(iso);
 try{
  const [readings,cal]=await Promise.all([
   fetchCatholicJson("/readings/"+year+"/"+md+".json"),
   fetchCatholicJson("/liturgical-calendar/"+year+"/"+md+".json")
  ]);
  if(!readings&&!cal)throw new Error("Sem dados litúrgicos");
  const celebration=cal&&cal.celebration?cal.celebration:null;
  const cName=celebration?translateCelebrationName(celebration.name):"";
  const rank=celebration?translateCelebrationType(celebration.type):"";
  const season=translateSeason((cal&&cal.season)||(readings&&readings.season)||"");
  const liturgicalDay=cName?(rank?rank+" — "+cName:cName):season;
  const isSaint=celebration&&/(Saint|Saints|Blessed|Virgin Mary|Our Lady)/i.test(celebration.name||"");
  const saints=isSaint?[cName]:["Sem memória própria de santo nesta data"];
  const gospel=readings&&readings.readings?translateGospelRef(readings.readings.gospel):"";
  const data={liturgical_day:liturgicalDay||"Liturgia do dia",saints,gospel,liturgy_url:liturgiaUrlForDate(iso)};
  REMOTE_LITURGY_CACHE[iso]=data;
  try{localStorage.setItem("liturgia:"+iso,JSON.stringify(data))}catch(e){}
 }catch(e){REMOTE_LITURGY_FAILED.add(iso)}
 finally{REMOTE_LITURGY_LOADING.delete(iso);if(statsIso()===iso)renderDailyInfo()}
}

function mergeUnique(...lists){return [...new Set(lists.flat().filter(Boolean))]}
function fallbackCalendarInfo(iso){
 const mmdd=iso.slice(5);
 return {date:iso,un_days:UN_FALLBACK[mmdd]||[],european_days:EUROPE_FALLBACK[mmdd]||[],portugal_days:portugalDaysFor(iso),local_days:LOCAL_FALLBACK[mmdd]||[],history_days:historyDaysFor(iso),astronomy_days:ASTRONOMY_BY_DATE[iso]||[],liturgical_day:"",saints:[],gospel:"",liturgy_url:liturgiaUrlForDate(iso)};
}
function calendarInfoFor(iso){
 const fb=fallbackCalendarInfo(iso);
 const src=CALENDAR_INFO&&CALENDAR_INFO.dates&&CALENDAR_INFO.dates[iso]?CALENDAR_INFO.dates[iso]:(DAILY_INFO&&DAILY_INFO.date===iso?DAILY_INFO:null);
 let out=src?{...fb,...src,
  un_days:mergeUnique(fb.un_days,src.un_days||[]),
  european_days:mergeUnique(fb.european_days,src.european_days||[]),
  portugal_days:mergeUnique(fb.portugal_days,src.portugal_days||[]),
  local_days:mergeUnique(fb.local_days,src.local_days||[]),
  history_days:mergeUnique(fb.history_days,src.history_days||[]),
  astronomy_days:mergeUnique(fb.astronomy_days,src.astronomy_days||[]),
  liturgy_url:src.liturgy_url||fb.liturgy_url
 }:fb;
 const remote=REMOTE_LITURGY_CACHE[iso]||remoteLiturgyFromStorage(iso);
 if(remote)out={...out,...remote,saints:remote.saints&&remote.saints.length?remote.saints:out.saints};
 return out;
}

  '<div class="daily-row"><div class="daily-label">Evangelho</div><div class="daily-value">'+gospel+' · <a href="'+litUrl+'" target="_blank" rel="noopener">ver Liturgia diária</a></div></div>';
}
