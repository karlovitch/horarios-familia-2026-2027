function currentSegmentInfo(p,today){
 const cfg=SCHOOL_CALENDARS[p],segs=cfg._segments;
 if(today<=segs[0].endDay)return {segment:segs[0],index:0};
 for(let i=1;i<segs.length;i++){
  if(today<=segs[i].endDay)return {segment:segs[i],index:i};
 }
 return {segment:segs[segs.length-1],index:segs.length-1};
}
function schoolStatus(p,refDay){
 const cfg=SCHOOL_CALENDARS[p],today=refDay??currentLocalDay(),info=currentSegmentInfo(p,today),seg=info.segment;
 const elapsedYear=countEffectiveDays(p,cfg.yearStart,Math.min(today-1,cfg.yearEnd));
 const elapsedSegment=countEffectiveDays(p,seg.startDay,Math.min(today-1,seg.endDay));
 const remainingSegment=countEffectiveDays(p,Math.max(today,seg.startDay),seg.endDay);
 const remainingYear=countEffectiveDays(p,Math.max(today,cfg.yearStart),cfg.yearEnd);
 if(info.index===0){
  return cfg.label+' — '+elapsedSegment+' dias efetivos de aulas decorridos desde o início do '+seg.name+' · faltam '+remainingSegment+' para o fim do '+cfg.type+' · faltam '+remainingYear+' para o fim do ano letivo';
 }
 return cfg.label+' — '+elapsedYear+' dias efetivos de aulas decorridos desde o início do ano letivo · '+elapsedSegment+' desde o início do '+seg.name+' · faltam '+remainingSegment+' para o fim do '+cfg.type+' · faltam '+remainingYear+' para o fim do ano letivo';
}

function familyEventsFor(iso){
 const mmdd=iso.slice(5),year=Number(iso.slice(0,4));
 return FAMILY_EVENTS.filter(e=>e.date.slice(5)===mmdd).map(e=>{
  const baseYear=Number(e.date.slice(0,4)),years=year-baseYear;
  return e.kind==="birthday"?"Aniversário de "+e.label+" — "+years+" anos":e.label+" — "+years+" anos";
 });

function daysToNextAnnual(refIso,eventDate){
 const [ry,rm,rd]=refIso.split("-").map(Number),[,em,ed]=eventDate.split("-").map(Number);
 const ref=Math.floor(Date.UTC(ry,rm-1,rd)/MS_DAY);
 let target=Math.floor(Date.UTC(ry,em-1,ed)/MS_DAY);
 if(target<ref)target=Math.floor(Date.UTC(ry+1,em-1,ed)/MS_DAY);
 return target-ref;
}

 }
