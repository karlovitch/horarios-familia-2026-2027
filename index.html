 return d.toISOString().slice(0,10);
}

function nextAnnualDate(refIso,eventDate){
 const [ry,rm,rd]=refIso.split("-").map(Number),[,em,ed]=eventDate.split("-").map(Number);
 let y=ry;
 let target=Date.UTC(y,em-1,ed),ref=Date.UTC(ry,rm-1,rd);
 if(target<ref){y++;target=Date.UTC(y,em-1,ed)}
 return {year:y,month:em,day:ed,targetDay:Math.floor(target/MS_DAY),refDay:Math.floor(ref/MS_DAY)};
}

function addUtcMonthsClamped(d,months){
 const y=d.getUTCFullYear(),m=d.getUTCMonth(),day=d.getUTCDate();
 const first=new Date(Date.UTC(y,m+months,1));
 const last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();
 return new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth(),Math.min(day,last)));
}
function birthdayDurationParts(refIso,eventDate){
 const next=nextAnnualDate(refIso,eventDate);
 const ref=dateFromIso(refIso),target=new Date(next.targetDay*MS_DAY);
 let months=0,cursor=new Date(ref.getTime());
 while(true){
  const candidate=addUtcMonthsClamped(ref,months+1);
  if(candidate.getTime()<=target.getTime())months++;
  else break;
 }
 cursor=addUtcMonthsClamped(ref,months);
 const remDays=Math.round((target.getTime()-cursor.getTime())/MS_DAY);
 const weeks=Math.floor(remDays/7),days=remDays%7;
 return {totalDays:next.targetDay-next.refDay,months,weeks,days};
}
function unit(n,singular,plural){return n+" "+(n===1?singular:plural)}
function birthdayCountdownText(iso){

  }).join(" · ");
}

async function fetchCatholicJson(path){
 for(const base of [CATHOLIC_DATA_BASE,CATHOLIC_DATA_RAW]){
  try{const r=await fetch(base+path,{cache:"no-store"});if(r.ok)return await r.json()}catch(e){}

async function ensureRemoteLiturgy(iso){
 if(REMOTE_LITURGY_CACHE[iso]||REMOTE_LITURGY_LOADING.has(iso)||REMOTE_LITURGY_FAILED.has(iso))return;
 if(remoteLiturgyFromStorage(iso)){renderDailyInfo();return}
 const year=iso.slice(0,4),md=iso.slice(5);
 if(!["2026","2027"].includes(year))return;
 REMOTE_LITURGY_LOADING.add(iso);
 try{
  const [readings,cal]=await Promise.all([
   fetchCatholicJson("/readings/"+year+"/"+md+".json"),
   fetchCatholicJson("/liturgical-calendar/"+year+"/"+md+".json")
  ]);
  if(!readings&&!cal)throw new Error("Sem dados litúrgicos");
  const celebration=cal&&cal.celebration?cal.celebration:null;
  const cName=celebration?translateCelebrationName(celebration.name):"";
  const rank=celebration?translateCelebrationType(celebration.type):"";
  const season=translateSeason((cal&&cal.season)||(readings&&readings.season)||"");

  const isSaint=celebration&&/(Saint|Saints|Blessed|Virgin Mary|Our Lady)/i.test(celebration.name||"");

  REMOTE_LITURGY_CACHE[iso]=data;
  try{localStorage.setItem("liturgia:v25:"+iso,JSON.stringify(data))}catch(e){}
 }catch(e){REMOTE_LITURGY_FAILED.add(iso)}
 finally{REMOTE_LITURGY_LOADING.delete(iso);if(statsIso()===iso)renderDailyInfo()}
}
