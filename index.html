 if(meta.camoes){
  const a=y-1579,b=y-1580;
  return meta.label+" — morte de Luís de Camões em 1579 ou 1580 · há "+a+" ou "+b+" anos";

}

function isEffectiveSchoolDay(p,day){
 const cfg=SCHOOL_CALENDARS[p],dow=new Date(day*MS_DAY).getUTCDay();
 if(!cfg.weekdays.includes(dow))return false;
 if(HOLIDAY_DAYS.has(day)||cfg._exclusions.has(day))return false;
 if(!cfg._segments.some(s=>day>=s.startDay&&day<=s.endDay))return false;

 }

function sportsEventsFor(iso){
 const src=(SPORTS_INFO.events||[]).filter(e=>e.start?localIsoForInstant(e.start)===iso:e.date===iso),out=[],rm=[];
 for(const e of src){if(e.entity==="Real Madrid")rm.push(e);else out.push(e)}
 if(rm.length){
  const byTime=new Map(),score=e=>(e.start?4:0)+(e.location&&!/confirmar/i.test(e.location)?3:0)+(/Fase de Liga|LALIGA EA SPORTS/i.test(e.competition||"")?2:0)+(e.match_url?1:0);
  for(const e of rm){
   const k=e.start||"sem-hora";
   if(!byTime.has(k)||score(e)>score(byTime.get(k)))byTime.set(k,e);
  }
  out.push(...byTime.values());
 }
 return out.sort((a,b)=>(a.start||"9999").localeCompare(b.start||"9999")||(a.entity||"").localeCompare(b.entity||"","pt"));
}

function liveClockText(ev){
 if(ev.status==="halftime")return "Intervalo";
 if(ev.status!=="live")return "";
 if(ev.period_start){
  const now=Math.floor(Date.now()/1000),elapsed=Math.max(0,now-Number(ev.period_start));
  const base=ev.period==="2H"?45:(ev.period==="ET2"?105:(ev.period==="ET1"?90:0));
  const total=base*60+elapsed;

  // DD representa o início real da parte atual. Se a fonte ficar presa em 1H
  // durante demasiado tempo, evita mostrar minutos impossíveis.
  if(/futebol/i.test(ev.sport||"")&&ev.period==="1H"&&total>=55*60){
   const updated=Number(ev.status_updated_at||0);
   if(!updated||now-updated>420)return "Intervalo";
  }

  const mm=Math.floor(total/60),ss=total%60;
  return String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
 }
 if(ev.live_minute!=null){
  const n=Number(ev.live_minute);
  if(Number.isFinite(n)&&n>=0&&n<=150)return String(Math.floor(n))+"'";
 }
 return "Em jogo";
}

}

async function loadHistoryInfo({force=false}={}){
 const state=DATA_LOAD_STATE.history;
 if(state.promise)return state.promise;
 if(!force&&dataFresh("history"))return HISTORY_INFO;
 if(!force&&state.attemptedAt&&!state.loadedAt&&Date.now()-state.attemptedAt<60000)return HISTORY_INFO;
 state.attemptedAt=Date.now();
 state.promise=(async()=>{
  try{
   HISTORY_INFO=await fetchJsonResource("history-info.json",{ts:Date.now()});
   state.loadedAt=Date.now();
  }catch(_){
   // O service worker já tenta a cópia em cache; evita duplicar ~2,3 MB no localStorage.
  }finally{state.promise=null}
  return HISTORY_INFO;
 })();
 return state.promise;
}
async function loadDailyInfo({force=false}={}){
 const state=DATA_LOAD_STATE.daily;
 if(state.promise)return state.promise;
 if(!force&&dataFresh("daily"))return {calendar:CALENDAR_INFO,daily:DAILY_INFO};
 state.promise=(async()=>{
  const [calResult,dailyResult]=await Promise.allSettled([
   fetchJsonResource("calendar-info.json"),
   fetchJsonResource("daily-info.json",{d:isoLocalDate()})
  ]);
  if(calResult.status==="fulfilled"){
   CALENDAR_INFO=calResult.value;storageWrite("calendarInfo",CALENDAR_INFO);
  }else{
   CALENDAR_INFO=CALENDAR_INFO||storageRead("calendarInfo",null);
  }
  if(dailyResult.status==="fulfilled"){
   DAILY_INFO=dailyResult.value;storageWrite("dailyInfo",DAILY_INFO);
  }else{
   DAILY_INFO=DAILY_INFO||storageRead("dailyInfo",null);
  }
  state.loadedAt=Date.now();
  state.promise=null;
  return {calendar:CALENDAR_INFO,daily:DAILY_INFO};
 })();
 return state.promise;
}

function weekdayFromIso(iso){return WEEK[dateFromIso(iso).getUTCDay()]}
function isoForWeekday(referenceIso,targetDow){
 const d=dateFromIso(referenceIso),dow=d.getUTCDay(),mondayOffset=(dow===0?-6:1-dow);
 const monday=new Date(d.getTime()+mondayOffset*MS_DAY);
 const target=new Date(monday.getTime()+(targetDow-1)*MS_DAY);
 return target.toISOString().slice(0,10);
}

 if(p==="Carlos"&&INTERCALARY_MEETINGS[iso]==="all")return "Reuniões de Avaliação Intercalar";
 return "";

async function checkForNewBuild(){
 try{
  const r=await fetch("index.html?__version_check="+Date.now(),{cache:"no-store",headers:{"Cache-Control":"no-cache"}});
  if(!r.ok)return false;
  const html=await r.text(),m=html.match(/· v(\d+)/);
  const latest=m?Number(m[1]):APP_BUILD;
  if(latest>APP_BUILD){
   const u=new URL(location.href);
   u.searchParams.set("v",String(latest));
   u.searchParams.set("__fresh",String(Date.now()));
   location.replace(u.toString());
   return true;
  }
 }catch(e){}
 return false;
}
async function refreshWhenVisible(reason="visible"){
 if(document.visibilityState&&document.visibilityState!=="visible")return;
 const now=Date.now();
 if(foregroundRefreshRunning||now-lastForegroundRefresh<1200)return;
 foregroundRefreshRunning=true;lastForegroundRefresh=now;
 try{
  if("serviceWorker" in navigator){
   try{const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}catch(e){}
  }
  const reloading=await checkForNewBuild();
  if(!reloading)await refreshCurrentView();
 }finally{foregroundRefreshRunning=false}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refreshWhenVisible("visibilitychange")});
