name: Gerar ícones PNG da aplicação

on:
  workflow_dispatch:
  push:
    paths:
      - "icon.svg"
      - ".github/workflows/generate-app-icons.yml"

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: pip install pillow

      - name: Gerar PNGs a partir do ícone original
        shell: python
        run: |
          import base64, io, re
          from pathlib import Path
          from PIL import Image

          svg = Path("icon.svg").read_text(encoding="utf-8")
          m = re.search(r"data:image/png;base64,([^\"]+)", svg)
          if not m:
              raise SystemExit("PNG incorporado não encontrado em icon.svg")

          raw = base64.b64decode(m.group(1))
          src = Image.open(io.BytesIO(raw)).convert("RGB")

          # O PNG incorporado é o ícone exato aprovado; apenas mudamos a resolução.
          src.resize((192, 192), Image.Resampling.LANCZOS).save("icon-192.png", optimize=True)
          src.resize((512, 512), Image.Resampling.LANCZOS).save("icon-512.png", optimize=True)
          src.resize((180, 180), Image.Resampling.LANCZOS).save("apple-touch-icon.png", optimize=True)
          src.resize((64, 64), Image.Resampling.LANCZOS).save("favicon-64.png", optimize=True)

          # Variante maskable para Android: mantém todo o desenho dentro da zona segura.
          canvas = Image.new("RGB", (512, 512), (246, 242, 235))
          safe = src.resize((410, 410), Image.Resampling.LANCZOS)
          canvas.paste(safe, ((512-410)//2, (512-410)//2))
          canvas.save("icon-maskable-512.png", optimize=True)

      - name: Guardar ícones
        shell: bash
        run: |
          mkdir -p /tmp/app-icons
          cp icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon-64.png /tmp/app-icons/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/app-icons/* .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon-64.png
          if git diff --cached --quiet; then
            echo "Ícones já atualizados."
          else
            git commit -m "Gerar ícones PNG da aplicação"
            git push
          fi
