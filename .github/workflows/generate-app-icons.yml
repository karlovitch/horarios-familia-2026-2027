name: Gerar ícones PNG da aplicação

on:
  workflow_dispatch:
  push:
    paths:
      - ".icon-source2/**"
      - ".github/workflows/generate-app-icons.yml"

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: pip install pillow

      - name: Gerar PNGs reais a partir do ícone aprovado
        shell: python
        run: |
          import base64, io
          from pathlib import Path
          from PIL import Image

          parts = sorted(Path(".icon-source2").glob("c*.txt"))
          if not parts:
              raise SystemExit("Fonte do ícone não encontrada.")
          encoded = "".join(p.read_text(encoding="utf-8").strip() for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          src = Image.open(io.BytesIO(raw)).convert("RGB")
          if src.size != (512, 512):
              src = src.resize((512, 512), Image.Resampling.LANCZOS)

          # PNGs reais: evitam o problema do launcher Android com o SVG anterior.
          src.resize((192, 192), Image.Resampling.LANCZOS).save("icon-192.png", optimize=True)
          src.save("icon-512.png", optimize=True)
          src.resize((180, 180), Image.Resampling.LANCZOS).save("apple-touch-icon.png", optimize=True)
          src.resize((64, 64), Image.Resampling.LANCZOS).save("favicon-64.png", optimize=True)

          # Variante Android maskable, mantendo o desenho dentro da zona segura.
          canvas = Image.new("RGB", (512, 512), (246, 242, 235))
          safe = src.resize((410, 410), Image.Resampling.LANCZOS)
          canvas.paste(safe, ((512 - 410)//2, (512 - 410)//2))
          canvas.save("icon-maskable-512.png", optimize=True)

      - name: Guardar ícones
        shell: bash
        run: |
          mkdir -p /tmp/app-icons
          cp icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon-64.png /tmp/app-icons/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/app-icons/* .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon-64.png
          if git diff --cached --quiet; then
            echo "Ícones já atualizados."
          else
            git commit -m "Gerar ícones PNG reais da aplicação"
            git push
          fi
