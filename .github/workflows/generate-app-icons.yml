name: Gerar ícones PNG da aplicação

on:
  workflow_dispatch:
  push:
    paths:
      - "icon-source.webp"
      - ".github/workflows/generate-app-icons.yml"

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: pip install pillow

      - name: Gerar PNGs do ícone aprovado
        shell: python
        run: |
          from PIL import Image

          src = Image.open("icon-source.webp").convert("RGB")

          src.resize((192, 192), Image.Resampling.LANCZOS).save("icon-192.png", optimize=True)
          src.resize((512, 512), Image.Resampling.LANCZOS).save("icon-512.png", optimize=True)
          src.resize((180, 180), Image.Resampling.LANCZOS).save("apple-touch-icon.png", optimize=True)
          src.resize((64, 64), Image.Resampling.LANCZOS).save("favicon-64.png", optimize=True)

          # Mesma imagem também para Android maskable; o desenho já tem margem segura.
          src.resize((512, 512), Image.Resampling.LANCZOS).save("icon-maskable-512.png", optimize=True)

      - name: Guardar ícones
        shell: bash
        run: |
          mkdir -p /tmp/app-icons
          cp icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon-64.png /tmp/app-icons/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/app-icons/* .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon-64.png
          if git diff --cached --quiet; then
            echo "Ícones já atualizados."
          else
            git commit -m "Gerar ícones PNG do design aprovado"
            git push
          fi
