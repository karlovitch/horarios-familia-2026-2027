name: Sincronizar agendas pessoais

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - "scripts/sync_personal_calendars.py"
      - ".github/workflows/sync-personal-calendars.yml"

permissions:
  contents: write

concurrency:
  group: personal-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --disable-pip-version-check requests icalendar recurring-ical-events cryptography

      - name: Sincronizar e encriptar agendas
        env:
          CARLOS_CALENDAR_ICS_URL: ${{ secrets.CARLOS_CALENDAR_ICS_URL }}
          SANDRINHA_CALENDAR_ICS_URL: ${{ secrets.SANDRINHA_CALENDAR_ICS_URL }}
          PERSONAL_CALENDAR_PASSPHRASE: ${{ secrets.PERSONAL_CALENDAR_PASSPHRASE }}
        run: python scripts/sync_personal_calendars.py

      - name: Publicar apenas quando houver alterações
        shell: bash
        run: |
          if git diff --quiet -- personal-calendar.enc.json; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personal-calendar.enc.json
          git commit -m "Atualizar agendas pessoais"
          git pull --rebase origin main
          git push origin HEAD:main
