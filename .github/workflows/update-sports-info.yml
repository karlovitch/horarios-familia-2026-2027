name: Atualizar agenda desportiva

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_sports_info.py"
      - ".github/workflows/update-sports-info.yml"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Atualizar agendas desportivas
        run: python scripts/update_sports_info.py

      - name: Guardar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports-info.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Atualizar agenda desportiva"
            git push
          fi
