name: Atualizar informação diária

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Atualizar efemérides e liturgia
        run: python scripts/update_daily_info.py

      - name: Guardar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-info.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Atualizar informação diária"
            git push
          fi
